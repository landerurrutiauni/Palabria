name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: palabria
          POSTGRES_PASSWORD: palabria
          POSTGRES_DB: palabria_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U palabria" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://palabria:palabria@localhost:5432/palabria_test
      E2E_DATABASE_URL: postgres://palabria:palabria@localhost:5432/palabria_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run content:validate
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
      - name: Exportación estática (GitHub Pages) contra la API de desarrollo
        run: npm run build:pages
        env:
          NEXT_PUBLIC_BASE_PATH: /Pasapalabra
          NEXT_PUBLIC_API_URL: http://localhost:3301
          NEXT_PUBLIC_DEV_AUTH: "1"
      - run: npm run test:e2e:static
        env:
          CI: "true"
