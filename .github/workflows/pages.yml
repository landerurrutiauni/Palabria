name: GitHub Pages + Supabase

# Despliega el juego completo:
#  1. Supabase: migraciones de la base de datos, secretos y la Edge Function «api»
#     (la lógica autoritativa del juego).
#  2. GitHub Pages: la interfaz como exportación estática de Next.js.
#
# Secretos del repositorio (Settings → Secrets and variables → Actions → Secrets):
#   SUPABASE_ACCESS_TOKEN  token personal de https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   contraseña de la base de datos del proyecto
#   CHALLENGE_SALT         semilla secreta de la selección diaria (openssl rand -base64 32)
# Variables opcionales (pestaña Variables): SUPABASE_PROJECT_REF, SUPABASE_PUBLISHABLE_KEY,
# ALLOWED_ORIGINS. Los valores por defecto son los del proyecto publicado.

on:
  push:
    branches: [claude/sharp-hawking-qf0f79, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-supabase
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'pkbxxjumiafigigzegxi' }}
  # Clave pública (publishable): puede ir en el navegador, la seguridad la da el servidor.
  SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_s_gBUasg5Jd318EPsf2xpA_hFcxkeAc' }}

jobs:
  supabase:
    name: Supabase (base de datos y Edge Function)
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      CHALLENGE_SALT: ${{ secrets.CHALLENGE_SALT }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS || format('https://{0}.github.io', github.repository_owner) }}
    steps:
      - name: Comprobar secretos
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD"
          [ -n "$CHALLENGE_SALT" ] || missing="$missing CHALLENGE_SALT"
          if [ -n "$missing" ]; then
            echo "::error::Faltan secretos del repositorio:$missing (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Empaquetar la Edge Function
        run: npm run build:edge
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Vincular el proyecto
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Aplicar migraciones
        run: supabase db push
      - name: Guardar secretos de la función
        run: >-
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF"
          "CHALLENGE_SALT=$CHALLENGE_SALT" "ALLOWED_ORIGINS=$ALLOWED_ORIGINS"
      - name: Desplegar la Edge Function
        run: supabase functions deploy api --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - name: Comprobar la API
        run: |
          url="https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/api/health"
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$url"; then echo; exit 0; fi
            sleep 10
          done
          echo "::error::La API no responde en $url"
          exit 1

  build:
    name: Compilar la web estática
    needs: supabase
    runs-on: ubuntu-latest
    env:
      NEXT_OUTPUT: export
      NEXT_PUBLIC_STATIC: "1"
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
      - name: Exportación estática
        run: npm run build:pages
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://${{ env.SUPABASE_PROJECT_REF }}.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_URL: https://${{ env.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/api
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
