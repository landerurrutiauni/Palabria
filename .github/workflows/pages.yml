name: GitHub Pages + Supabase

# Publica la interfaz en GitHub Pages (exportación estática de Next.js).
#
# La base de datos y la Edge Function «api» de Supabase ya están desplegadas.
# Si además añades el secreto SUPABASE_ACCESS_TOKEN (token personal de
# https://supabase.com/dashboard/account/tokens), este flujo también aplica las
# migraciones nuevas, activa el inicio de sesión anónimo y vuelve a desplegar la
# función en cada cambio. Sin ese secreto, el paso de Supabase se omite.
# Variables opcionales (Settings → Secrets and variables → Actions → Variables):
# SUPABASE_PROJECT_REF, SUPABASE_PUBLISHABLE_KEY y ALLOWED_ORIGINS.

on:
  push:
    branches: [claude/sharp-hawking-qf0f79, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-supabase
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'pkbxxjumiafigigzegxi' }}
  # Clave pública (publishable): puede ir en el navegador, la seguridad la da el servidor.
  SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_s_gBUasg5Jd318EPsf2xpA_hFcxkeAc' }}

jobs:
  supabase:
    name: Supabase (opcional)
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS || format('https://{0}.github.io', github.repository_owner) }}
    steps:
      - name: ¿Hay token de Supabase?
        id: check
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Sin SUPABASE_ACCESS_TOKEN: se publica solo la web (Supabase no se toca)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.check.outputs.enabled == 'true'
        run: npm ci
      - name: Inicio de sesión anónimo y migraciones
        if: steps.check.outputs.enabled == 'true'
        run: node scripts/supabase-setup.mjs
      - name: Empaquetar la Edge Function
        if: steps.check.outputs.enabled == 'true'
        run: npm run build:edge
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.enabled == 'true'
        with:
          version: latest
      - name: Desplegar la Edge Function
        if: steps.check.outputs.enabled == 'true'
        run: |
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" "ALLOWED_ORIGINS=$ALLOWED_ORIGINS"
          supabase functions deploy api --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - name: Comprobar la API
        if: steps.check.outputs.enabled == 'true'
        run: |
          url="https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/api/health"
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$url"; then echo; exit 0; fi
            sleep 10
          done
          echo "::error::La API no responde en $url"
          exit 1

  build:
    name: Compilar la web estática
    needs: supabase
    runs-on: ubuntu-latest
    env:
      NEXT_OUTPUT: export
      NEXT_PUBLIC_STATIC: "1"
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
      - name: Exportación estática
        run: npm run build:pages
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://${{ env.SUPABASE_PROJECT_REF }}.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_URL: https://${{ env.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/api
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Comprobar el juego publicado
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: API, CORS, identidad anónima y web
        run: node scripts/smoke-live.mjs
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
